[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todoist-cli"
version = "0.1.0"
description = "Todoist from the terminal: a calendar-aware weekly planner, time tracking to Google Calendar, and everyday task commands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "hypothesis>=6.100.0"]

[project.scripts]
todoist = "todoist_cli.cli:main"

[tool.setuptools]
packages = ["todoist_cli"]
script-files = ["bin/gog-reauth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
