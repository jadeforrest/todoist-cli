# Mutants for tools/mutate.py — see that file's docstring for the why.
#
# Each entry replaces `old` with `new` in `file`, once, on a throwaway copy of
# the repo, then runs the suite. The suite is expected to FAIL (the mutant is
# "killed"). A mutant that survives names a behavior nothing tests.
#
# `old` must match exactly once, so keep the anchor small but unique. When you
# refactor the anchored line, the mutant reports SKIPPED — update it or drop it.
#
# Add mutants as you write new logic. Aim them at what's easy to get wrong and
# invisible when wrong: boundary comparisons (< vs <=), dropped guard clauses,
# a default that silently substitutes for a real value.

